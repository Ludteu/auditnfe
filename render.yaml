services:
  - type: web
    name: nfe-emitter
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: nfe-emitter-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: SEFAZ_ENV
        value: homologacao
      - key: SEFAZ_UF
        value: SP
      - key: SEFAZ_TIMEOUT
        value: 30000
      - key: MERCADOLIVRE_CLIENT_ID
        sync: false
      - key: MERCADOLIVRE_CLIENT_SECRET
        sync: false
      - key: MERCADOLIVRE_REDIRECT_URI
        sync: false

databases:
  - name: nfe-emitter-db
    plan: free
    databaseName: nfe_emitter
    user: nfe_emitter
